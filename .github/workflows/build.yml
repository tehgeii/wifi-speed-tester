name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Actions → build → "Run workflow": builds the zips from the chosen branch
  # and publishes them as release v<version>, creating the tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (creates tag v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: vet (windows target)
        if: runner.os == 'Linux'
        run: GOOS=windows go vet ./...
      - name: test (race)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: test
        if: runner.os == 'Windows'
        run: go test ./...

  package:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: pick version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then V="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
          else V="0.0.0-${GITHUB_SHA::7}"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$V')"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: build portable zips
        run: |
          scripts/build.sh "${{ steps.version.outputs.version }}"
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: WiFiSpeedTester-Portable
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  # Runs the real Windows code paths (adapter detection, ICMP, Cloudflare
  # speed test) on a hosted runner. Hosted networks often block ICMP and may
  # throttle, so this is informative rather than a gate.
  smoke-windows:
    needs: package
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WiFiSpeedTester-Portable
      - shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem *win-x64.zip).FullName -DestinationPath app
          $p = Start-Process app\WiFiSpeedTester.exe -ArgumentList '--cli','--json' -RedirectStandardOutput result.json -RedirectStandardError progress.txt -Wait -PassThru
          Get-Content progress.txt
          Get-Content result.json
          $code = $p.ExitCode
          Write-Host "--- quick ping, Indonesian report ---"
          $q = Start-Process app\WiFiSpeedTester.exe -ArgumentList '--cli','--quick','--lang','id' -RedirectStandardOutput quick.txt -RedirectStandardError quick-progress.txt -Wait -PassThru
          Get-Content quick.txt
          Write-Host "--- public LibreSpeed servers ---"
          $l = Start-Process app\WiFiSpeedTester.exe -ArgumentList '--list-servers' -RedirectStandardOutput servers.txt -RedirectStandardError servers-progress.txt -Wait -PassThru
          Get-Content servers-progress.txt
          Get-Content servers.txt
          exit ($code -bor $q.ExitCode -bor $l.ExitCode)

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging
      - uses: actions/download-artifact@v4
        with:
          name: WiFiSpeedTester-Portable
          path: assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.package.outputs.version }}
          name: WiFi Speed + Ping Tester ${{ needs.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: packaging/RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            assets/*.zip
            assets/SHA256SUMS.txt
