name: pages

# Publishes the website in site/ to GitHub Pages
# (https://tehgeii.github.io/wifi-speed-tester/). The screenshots come from
# the UI test, so they always show the current app. One-time setup in the
# repository: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", "internal/ui/web/**", "ui-tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Same image as the UI test in build.yml (Playwright 1.56 support).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: screenshots from the UI test
        run: UI_SHOTS=shots scripts/ui-test.sh
      - name: assemble the site
        run: |
          mkdir -p _site/img
          cp site/index.html site/style.css site/app.js _site/
          cp shots/site-*.png _site/img/
          cp winres/icon.png _site/img/icon.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
